<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SOLUTION STORE</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <video id="vdo" autoplay muted loop class="bg-video">
    <source src="loginbg.mov" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>
  <script>
    const vdo = document.getElementById("vdo");
    vdo.playbackRate = 0.7;
  </script>
  <div class="overlay" id="loginOverlay">
    <div class="login-form">
      <h2>Sign-Up</h2>
      <form id="registrationform" >
        <center>
          <input type="text" name="Name" placeholder="Name" required />
          <input type="email" name="Email" placeholder="email" required />
          <input type="tel" name="MoNo" placeholder="Mobile Number" required />
          
          <input type="password" name="Password" placeholder="Password" required />
          <input type="password" name="re-password" placeholder="Re-Password" required />
          <button type="submit">Register</button>
        </center>
      </form>
      <p style="text-align: center; font-size: 12px;">Already have an acc ?, <a href="login.html" >Login</a></p>
    </div>
    <!--<span class="close-btn" onclick="document.getElementById('loginOverlay').style.display='none'">&times;</span>-->
  </div>
  <script>
        document.getElementById("registrationform").addEventListener("submit", function(event){
            event.preventDefault(); // prevent form from submitting normally

            const formData = new FormData(this);

            fetch("register.php", {
                method: "POST",
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                alert(data); // Show alert message returned from PHP
                window.location.href = "login.html"; // Redirect to login page
                document.getElementById("registrationForm").reset(); // Optionally reset form
            })
            .catch(error => {
                console.error("Error:", error);
            });
        });
    </script>

</body>
</html>
