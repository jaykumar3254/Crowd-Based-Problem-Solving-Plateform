<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SOLUTION STORE</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <!-- Background Video -->
  <video id="vdo" autoplay muted loop class="bg-video">
    <source src="loginmv.mov" type="video/mp4">
    Your browser does not support HTML5 video.
  </video>
  <script>
    const vdo = document.getElementById("vdo");
    vdo.playbackRate = 0.7;
  </script>
  <div class="overlay" id="loginOverlay">
    <div class="login-form">
      <h2>Login</h2>
      <form id="loginForm" >
        <center>
          <input type="text" name="email" placeholder="Email" required />
          <input type="password" name="password" placeholder="Password" required />
          <button type="submit">Login</button>
        </center>
      </form>
      <p style="text-align: center; font-size: 12px;">New here, <a href="signup.html" >Sign-Up</a></p>
    </div>
    
    <!--<span class="close-btn" onclick="document.getElementById('loginOverlay').style.display='none'">&times;</span>-->
  </div>
  <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const formData = new FormData(this);

            fetch("login.php", {
                method: "POST",
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                alert(data);
                if (data === "Login successful") {
                    window.location.href = "index.html"; // Redirect to index page on successful login
                } else {
                    document.getElementById("loginForm").reset(); // Reset form if login fails
                }
            })
            .catch(error => {
                console.error("Error:", error);
            });
        });
    </script>

</body>
</html>
